dependencies:
  idf: ">=6.0"
  espressif/cjson: "^1.7.18"
  espressif/mdns: "^1.8.0"
  # P4 only: esp_wifi has no radio of its own on this target, so every
  # esp_wifi_* call routes to the on-board C6 over SDIO. The rules key keeps
  # the ESP32 build's dependency set unchanged.
  #
  # Pinned to 3.0.x, not "*": components/cp_ota refuses to OTA a co-processor
  # whose esp_hosted version differs from this host's in major.minor, so the
  # two sides of that gate must move together deliberately. The coproc/
  # project (coproc/main/idf_component.yml) carries the mirror-image pin and
  # comment -- see coproc/README.md's "esp_hosted version pin" section.
  espressif/esp_hosted:
    version: "~3.0.7"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target == esp32p4"
  # P4 only: the 7" panel. Pinned EXACTLY -- no committed lock ever records the P4 resolution (the committed
  # master/dependencies.lock is the ESP32 one), so this manifest is the only guard. 3.0.1 / 9.5.0 / 0.6.4 is the
  # bench-proven set (touch mapping, lock semantics); a bump is a deliberate, bench-verified act.
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "==3.0.1"
    rules:
      - if: "target == esp32p4"
  lvgl/lvgl:                      # panel_ui calls lv_* directly -- declared, not ridden on the BSP's ~9.5.0
    version: "==9.5.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lvgl_adapter:     # the BSP only says ~0.6
    version: "==0.6.4"
    rules:
      - if: "target == esp32p4"
  espressif/libpng:               # pinned to the bench-proven revision: ~2 adds an unproven Kconfig and allocator hook
    version: "==1.6.58~1"
    rules:
      - if: "target == esp32p4"
